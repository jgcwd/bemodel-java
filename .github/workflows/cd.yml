name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bemodel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy on ubuntu4
    runs-on: [self-hosted, ubuntu4]
    timeout-minutes: 20

    env:
      APP_DIR: ${{ github.workspace }}/.deploy/bemodel-java
      BACKEND_PORT: 18080
      FRONTEND_PORT: 18081
      MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          node --version
          npm --version

          java -version 2>&1 | grep -q '21' || {
            echo 'ERROR: Java 21 is required.'
            exit 1
          }

      - name: Build backend
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -f bemodel-server/pom.xml clean package -DskipTests

      - name: Build frontend
        shell: bash
        working-directory: bemodel-web
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$APP_DIR/releases/${GITHUB_SHA}"
          mkdir -p "$APP_DIR/logs"

          cp bemodel-server/target/bemodel-server-1.0.0.jar \
            "$APP_DIR/releases/${GITHUB_SHA}/bemodel-server.jar"
          cp -a bemodel-web/dist \
            "$APP_DIR/releases/${GITHUB_SHA}/dist"

          ln -sfn "$APP_DIR/releases/${GITHUB_SHA}" "$APP_DIR/current"

          cat > "$APP_DIR/application.env" <<EOF
          MYSQL_USERNAME=${MYSQL_USERNAME}
          MYSQL_PASSWORD=${MYSQL_PASSWORD}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          JWT_SECRET=${JWT_SECRET}
          APP_SECRET_KEY=${APP_SECRET_KEY}
          EOF
          chmod 600 "$APP_DIR/application.env"

      - name: Deploy backend and frontend
        shell: bash
        run: |
          set -euo pipefail

          # Stop previous backend/frontend processes owned by this runner user.
          if [[ -f "$APP_DIR/backend.pid" ]]; then
            kill "$(cat "$APP_DIR/backend.pid")" 2>/dev/null || true
          fi
          if [[ -f "$APP_DIR/frontend.pid" ]]; then
            kill "$(cat "$APP_DIR/frontend.pid")" 2>/dev/null || true
          fi

          sleep 2

          # Remove stale processes still listening on the application ports.
          for port in "$BACKEND_PORT" "$FRONTEND_PORT"; do
            if command -v fuser >/dev/null 2>&1; then
              fuser -k "${port}/tcp" 2>/dev/null || true
            fi
          done

          # Start Spring Boot.
          set -a
          source "$APP_DIR/application.env"
          set +a

          nohup java -jar "$APP_DIR/current/bemodel-server.jar" \
            --server.port="$BACKEND_PORT" \
            > "$APP_DIR/logs/backend.log" 2>&1 &
          echo $! > "$APP_DIR/backend.pid"

          # Create a dependency-free Node static server + /api reverse proxy.
          # This avoids requiring root/sudo/nginx on the self-hosted runner.
          cat > "$APP_DIR/server.mjs" <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const root = path.resolve(process.env.STATIC_ROOT);
          const backendHost = '127.0.0.1';
          const backendPort = Number(process.env.BACKEND_PORT || 18080);
          const listenPort = Number(process.env.FRONTEND_PORT || 18081);

          const mime = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.ico': 'image/x-icon',
            '.woff': 'font/woff',
            '.woff2': 'font/woff2'
          };

          function safeFile(urlPath) {
            const decoded = decodeURIComponent(urlPath.split('?')[0]);
            const normalized = path.normalize(decoded).replace(/^([/\\])+/, '');
            const file = path.resolve(root, normalized);
            return file.startsWith(root + path.sep) || file === root ? file : null;
          }

          const server = http.createServer((req, res) => {
            if (req.url.startsWith('/api/')) {
              const proxyReq = http.request({
                hostname: backendHost,
                port: backendPort,
                path: req.url,
                method: req.method,
                headers: { ...req.headers, host: `${backendHost}:${backendPort}` }
              }, (proxyRes) => {
                res.writeHead(proxyRes.statusCode || 502, proxyRes.headers);
                proxyRes.pipe(res);
              });
              proxyReq.on('error', (err) => {
                res.writeHead(502, { 'content-type': 'application/json; charset=utf-8' });
                res.end(JSON.stringify({ message: 'Backend unavailable', error: err.message }));
              });
              req.pipe(proxyReq);
              return;
            }

            let file = safeFile(req.url || '/');
            if (!file) {
              res.writeHead(400);
              res.end('Bad Request');
              return;
            }

            if (file === root || !fs.existsSync(file) || fs.statSync(file).isDirectory()) {
              file = path.join(root, 'index.html');
            }

            fs.readFile(file, (err, data) => {
              if (err) {
                res.writeHead(404);
                res.end('Not Found');
                return;
              }
              const type = mime[path.extname(file).toLowerCase()] || 'application/octet-stream';
              res.writeHead(200, {
                'content-type': type,
                'cache-control': file.endsWith('index.html') ? 'no-cache' : 'public, max-age=31536000, immutable'
              });
              res.end(data);
            });
          });

          server.listen(listenPort, '0.0.0.0', () => {
            console.log(`BeModel frontend listening on ${listenPort}`);
          });
          NODE

          nohup env \
            STATIC_ROOT="$APP_DIR/current/dist" \
            BACKEND_PORT="$BACKEND_PORT" \
            FRONTEND_PORT="$FRONTEND_PORT" \
            node "$APP_DIR/server.mjs" \
            > "$APP_DIR/logs/frontend.log" 2>&1 &
          echo $! > "$APP_DIR/frontend.pid"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          echo 'Waiting for backend...'
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/$BACKEND_PORT) >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          if ! (echo > /dev/tcp/127.0.0.1/$BACKEND_PORT) >/dev/null 2>&1; then
            echo 'Backend did not start.'
            tail -n 100 "$APP_DIR/logs/backend.log" || true
            exit 1
          fi

          echo 'Waiting for frontend...'
          for i in {1..15}; do
            if curl -fsS "http://127.0.0.1:$FRONTEND_PORT/" >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS "http://127.0.0.1:$FRONTEND_PORT/" >/dev/null
          echo "Deployment successful: frontend :$FRONTEND_PORT, backend :$BACKEND_PORT"

      - name: Cleanup old releases
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find "$APP_DIR/releases" -mindepth 1 -maxdepth 1 -type d \
            ! -name "$GITHUB_SHA" -mtime +7 -exec rm -rf {} + || true
