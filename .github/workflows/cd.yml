name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bemodel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Docker deploy on ubuntu4
    runs-on: [self-hosted, ubuntu4]
    timeout-minutes: 30

    env:
      APP_DIR: /opt/bemodel-java
      FRONTEND_PORT: 18081
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          docker compose version

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR"

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(MYSQL_USERNAME MYSQL_PASSWORD DEEPSEEK_API_KEY JWT_SECRET APP_SECRET_KEY)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: GitHub Actions secret $name is not configured."
              exit 1
            fi
          done

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail

          # Compose reads credentials from the Actions environment.
          # No .env file containing secrets is written to the server.
          docker compose -f docker-compose.yml down --remove-orphans || true
          docker compose -f docker-compose.yml build --pull
          docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Verify containers
        shell: bash
        run: |
          set -euo pipefail

          echo 'Container status:'
          docker compose -f docker-compose.yml ps

          echo 'Waiting for backend TCP port...'
          for i in {1..45}; do
            if (echo > /dev/tcp/127.0.0.1/18080) >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          if ! (echo > /dev/tcp/127.0.0.1/18080) >/dev/null 2>&1; then
            echo 'Backend did not become reachable.'
            docker compose -f docker-compose.yml logs --tail=150 backend || true
            exit 1
          fi

          echo 'Waiting for frontend...'
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/" >/dev/null
          echo "Deployment successful: frontend :${FRONTEND_PORT}, backend :18080"

      - name: Cleanup Docker resources
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          docker image prune -f
